services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Change_this_Strong_Password123!}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  identity:
    build: ./src/backend/IdentityService
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDb: "Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Change_this_Strong_Password123!};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: EduSphere.Identity
      Jwt__Audience: EduSphere.Services
      Jwt__Key: "${JWT_SIGNING_KEY:-REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG}"
    depends_on: { sqlserver: { condition: service_healthy } }
  academics:
    build: ./src/backend/AcademicsService
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AcademicsDb: "Server=sqlserver;Database=AcademicsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Change_this_Strong_Password123!};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: EduSphere.Identity
      Jwt__Audience: EduSphere.Services
      Jwt__Key: "${JWT_SIGNING_KEY:-REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG}"
    depends_on: { sqlserver: { condition: service_healthy } }
  reporting:
    build: ./src/backend/ReportingService
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ReportingDb: "Server=sqlserver;Database=ReportingDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Change_this_Strong_Password123!};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: EduSphere.Identity
      Jwt__Audience: EduSphere.Services
      Jwt__Key: "${JWT_SIGNING_KEY:-REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG}"
    depends_on: { sqlserver: { condition: service_healthy } }
  gateway:
    build: ./src/backend/ApiGateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: EduSphere.Identity
      Jwt__Audience: EduSphere.Services
      Jwt__Key: "${JWT_SIGNING_KEY:-REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG}"
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080/
      ReverseProxy__Clusters__academics__Destinations__primary__Address: http://academics:8080/
      ReverseProxy__Clusters__reporting__Destinations__primary__Address: http://reporting:8080/
    ports: ["5080:8080"]
    depends_on: [identity, academics, reporting]
  frontend:
    build: ./src/frontend
    ports: ["5173:80"]
    depends_on: [gateway]
